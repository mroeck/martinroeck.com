title: Martin Röck
tagline: Life cycle science for a regenerative built environment
description: >-
  Martin Röck works on life cycle sustainability assessment, whole life carbon
  and the decarbonisation of the global built environment.

# Change this to your GitHub Pages URL, or to https://martinroeck.com if you
